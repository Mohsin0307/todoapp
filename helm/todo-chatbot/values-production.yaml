replicaCount: 2

backend:
  image:
    repository: ghcr.io/todo-chatbot/backend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  env:
    ENVIRONMENT: production

frontend:
  image:
    repository: ghcr.io/todo-chatbot/frontend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: todo.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend

dapr:
  enabled: true
  appId:
    backend: todo-backend
    frontend: todo-frontend

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

secrets:
  databaseUrl: ""
  jwtSecret: ""
  openaiApiKey: ""

configmap:
  appEnv: production
